name: ddd

# Common definition for every service.  The working tree is bind mounted at /work
# and PYTHONPATH makes it shadow the copy installed into the image, so the
# containers always run the current sources without a rebuild.
x-ddd: &ddd
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: ddd:dev
  working_dir: /work
  volumes:
    - .:/work
  environment: &environment
    PYTHONPATH: /work/src
    PYTHONDONTWRITEBYTECODE: "1"

services:
  # docker compose run --rm ddd ddd check examples/demo/demo.ddd.json
  ddd:
    <<: *ddd
    command: ["ddd", "--help"]

  check:
    <<: *ddd
    command: ["ddd", "check", "examples/demo/demo.ddd.json"]

  generate:
    <<: *ddd
    # The c templates come from the project, so the directory is not optional. This uses the
    # ones shipped as an example, which is also what `ddd templates-dir` prints.
    command:
      - ddd
      - generate
      - all
      - examples/demo/demo.ddd.json
      - -o
      - build/gen
      - --template-dir
      - examples/templates

  # Generates the demo project and compiles, links and inspects the result,
  # once without and once with the optional feature switched on.
  compile:
    <<: *ddd
    environment:
      <<: *environment
      CDEFS: "-DFEATURE_X"
    command: ["ddd-compile", "examples/demo/demo.ddd.json", "build/gen"]

  # Same, but with the input variables declared const in the consumer headers.
  compile-const:
    <<: *ddd
    environment:
      <<: *environment
      CDEFS: "-DFEATURE_X"
      GENFLAGS: "--const-inputs"
    command: ["ddd-compile", "examples/demo/demo.ddd.json", "build/gen-const"]

  # Configures and builds examples/cmake, which integrates the tool through cmake/Ddd.cmake:
  # the components are collected through the link graph and the generated sources are compiled.
  cmake:
    <<: *ddd
    command:
      - sh
      - -c
      - cmake -G Ninja -S examples/cmake -B build/cmake && cmake --build build/cmake

  test:
    <<: *ddd
    command: ["python", "-m", "pytest"]

  # Same run, plus a browsable report in build/htmlcov/index.html.
  coverage:
    <<: *ddd
    command:
      - python
      - -m
      - pytest
      - --cov-report=html:build/htmlcov
      - --cov-report=term-missing

  lint:
    <<: *ddd
    command: ["sh", "-c", "ruff check . && ruff format --check . && mypy"]

  # Builds the html documentation into build/docs/html, out of the same sources and with the
  # same warnings-as-errors gate as the ci job that publishes it to GitHub Pages. This service
  # is the local equivalent of that job, for working on the documentation without pushing.
  # Its requirements are in the image, like every other service's: installing them here made a
  # documentation build wait for pypi and run against whatever it answered with that day.
  docs:
    <<: *ddd
    command: ["sphinx-build", "-b", "html", "docs", "build/docs/html", "-W", "--keep-going"]

  shell:
    <<: *ddd
    command: ["bash"]
    stdin_open: true
    tty: true

  # docker compose up gui, then the printed address in a browser on the host: ddd gui, running
  # the image's own code and serving its own compiled pages rather than the working tree's.
  # PYTHONPATH is left out of the environment below, unlike every service above, because it
  # would shadow those with the working tree's, which usually has no compiled pages at all -
  # git does not track them. The project it opens is still the checkout's, though:
  # examples/demo is read, and an edit made in the browser writes it back, under /work, the
  # same bind mount as every service above - so an edit lands in the developer's own checkout,
  # and, on a native Linux engine, comes back owned by root, since this service runs as root
  # exactly as every service above does. --host 0.0.0.0 is what lets the container answer its
  # host at all, and publishing the same port number on the host's loopback alone, rather than
  # every interface, is what a browser there needs: a different number outside would have the
  # Host header ddd gui sees name a port it does not listen on, answered 421, and beyond the
  # container's own loopback the token in the printed address is the only thing keeping
  # another client out. stop_signal is SIGINT, what ddd gui catches for a clean exit, so
  # docker compose stop does not wait out its grace period on SIGTERM first.
  gui:
    <<: *ddd
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:8123:8123"
    stop_signal: SIGINT
    command:
      - ddd
      - gui
      - --host
      - 0.0.0.0
      - --port
      - "8123"
      - --no-browser
      - examples/demo/demo.ddd.json
