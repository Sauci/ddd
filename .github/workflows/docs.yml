name: Documentation

# The documentation is generated out of the sources - the command line reference from the
# argument parser, the file formats from the pydantic contracts - so it is built on every
# change and published from master. Warnings are errors, which is what makes that generation
# trustworthy: a reference that stops resolving fails the build instead of quietly
# disappearing from the page.
#
# The site keeps one directory per version. A push to master rewrites `latest`; a release,
# once Publish has published it, writes a directory named after its tag, and nothing else
# writes to that directory again. Old documentation describes old code, so rebuilding it would
# only expose it to a toolchain that has moved on - a two year old tag that no longer builds
# under the sphinx of the day would take the deployment of the current one down with it.
#
# A release's documentation waits for Publish. Both workflows used to start on the release
# itself, and neither waited for the other: a release Publish then refused - its tag naming a
# version pyproject.toml does not - or failed was published here all the same, and crowned
# stable, sending a reader at the root of the site to a version PyPI never received. So a
# release starts nothing here: Publish's run completing does, and this goes on only if that
# run was a release's and succeeded. A release tagged on a commit from before this file
# waited for Publish - a fix on a line branched earlier - is the exception, as GitHub runs a
# release's workflows from its tag: that commit's own docs.yml still publishes it on the
# release event, whatever Publish does, and this file publishes it again once Publish
# succeeds. GitHub documents what a run started by Publish's completion (`workflow_run`) is
# given, and of the release it holds only what Publish's run reports:
#
#   - it runs this file as the default branch has it, never the tag's, and so only once this
#     file is on master;
#   - its ref is master and its sha master's newest commit, so the release's commit is named
#     wherever it matters, as Publish's run reports it: `head_sha`;
#   - Publish's run is `github.event.workflow_run`, with the event that started it (`release`
#     for a release), its `conclusion` (`success` once it has published one) and, as
#     `head_branch`, the release's tag, which is the name the release is published under;
#   - its token has the permissions this file grants, write included, whatever the run that
#     started it had.
#
# Publish completes for every run it makes - a dispatch's dry run, a release it refused or
# failed, each re-run - and so does a workflow called Publish in a pull request from a fork:
# each starts a run here, and all but a published release's skip both jobs. GitHub delivers a
# re-run's completion too (only `requested` is not delivered for one), so a release Publish
# failed is published by a re-run of that run that passes: Re-run failed jobs, which runs
# again only the jobs that failed. Re-run all jobs cannot pass once the release is on PyPI. It
# runs the upload again, an index takes a file name once, and publish.yml asks for no
# skip-existing, so every such attempt fails the same way. A release no re-run can finish -
# what failed is in the tagged commit, which every re-run builds again, or every attempt left
# would repeat the upload - is published by hand: a dispatch of this workflow from master
# naming the release's tag (`inputs.tag`, below) builds the commit the tag names, refuses a
# tag that is not `v` and the version pyproject.toml states there, as Publish does, and
# publishes it through every check a release's run makes.
#
# A build produces one version, and the site is all of them, so the versions that are not
# being built have to come from somewhere: the `gh-pages` branch holds them. That branch is
# the site rather than an archive of it - Pages is configured to build from it, so the push
# below is the publish and there is no second copy to disagree with.
#
# The two diagram programs come from apt rather than from a prepared image, so that this needs
# nothing but a stock runner to reproduce. Only html is built: a pdf would want a LaTeX
# distribution, roughly a gigabyte of packages, and nothing asks for one.
on:
  push:
    branches: [master]
  pull_request:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  # Naming a release's tag, a dispatch from master publishes that release's documentation by
  # hand, for a release no re-run of its Publish can finish. With no tag, a dispatch builds the
  # ref it is run on and deploys `latest` from master alone, as it always has.
  workflow_dispatch:
    inputs:
      tag:
        description: A release's tag, to publish its documentation when no re-run of its Publish can
        type: string
        required: false
        default: ""

permissions:
  contents: read

# The published site and the branch it is archived on are both single shared resources, so
# master's runs, and dispatches naming no tag, wait for one another in one group rather than
# racing. GitHub keeps one run going and one waiting in a group, and cancels the waiting one
# when another arrives. Between master's own runs that costs nothing, since the newer push
# builds everything the run it replaced would have. A dispatch on another branch does cost
# something: it waits in the same group and deploys nothing, so when it replaces master's
# waiting run, `latest` is left a push behind, and nothing turns red, until master's next
# push. A release's run waiting there, though, was cancelled by the next push, with nothing
# red and no directory for the release - so each release's run is alone in a group of its
# own, named after the run, where nothing can wait for it or replace it: a run Publish's
# completion started, and a dispatch naming a release's tag. A release's deploy and master's
# can then run at once, which the push to gh-pages below allows for. Superseding a pull
# request build is free, and those deploy nothing.
concurrency:
  group: >-
    docs-${{ github.event_name == 'pull_request' && github.ref
    || (github.event_name == 'workflow_run'
    || github.event_name == 'workflow_dispatch' && inputs.tag != '')
    && format('release-{0}', github.run_id)
    || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Of the runs Publish's completion starts, only a release Publish published has anything
    # to build; every other event builds, as it always has.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'release'
      && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # The commit this build is of, which the deploy job names in its own: only this job knows
    # it, since for a release it is not the run's own.
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      # A release is built from the commit its tag names. Publish's run reports the commit it
      # ran on, which a run Publish's completion started has to name, being given master's
      # newest commit as its own. A dispatch naming a release's tag runs on master too, and
      # names the tag, as `refs/tags/...` so that a branch of that name is never what is built.
      # Every other run's own commit is the one to build, and `ref` is empty for them, which
      # leaves checkout to that default.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag && format('refs/tags/{0}', inputs.tag) }}
      - name: Say which commit this build is of
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          # What `.[docs]` resolves to: the metadata hook reads both files.
          cache-dependency-path: requirements*.txt

      # A release's tag has to be `v` and the version its commit states in pyproject.toml, as
      # Publish insists before it uploads anything. A release Publish published has passed that
      # already, and passes it again here; a tag named on a dispatch has been through no
      # Publish, and this is what refuses one naming a version its commit does not state -
      # documentation of a version PyPI never received, which the index would crown stable.
      - name: Check the tag names the version its commit states
        if: >-
          github.event_name == 'workflow_run'
          || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        env:
          TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: |
          version=$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG is not v$version, the version pyproject.toml states at the"
            echo "::error::commit it names. A release's documentation is published under its tag,"
            echo "::error::which has to be v and that version; name the tag of a release."
            exit 1
          fi

      # graphviz draws the entity relationship figures erdantic emits, and plantuml draws the
      # `.. uml::` diagrams, bringing the headless jre it runs on with it. docs/conf.py uses
      # the `plantuml` launcher on the PATH when no jar is pointed at, which is the one here.
      - name: Install the diagram tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz plantuml

      - run: pip install -e ".[docs]"
      - run: sphinx-build -b html docs build/docs/html -W --keep-going

      # A plain artifact rather than a Pages one: this is a single version, and what gets
      # published is this version merged into every other one the deploy job restores.
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: build/docs/html

  # Publishing needs Pages set to serve the gh-pages branch once, in the repository settings:
  # the push below lands whether or not anything serves the branch, and the read-back at the
  # end of the job is what notices when nothing does.
  deploy:
    needs: build
    # Never from a feature branch, and never from a pull request, which on a fork would mean
    # publishing somebody else's revision of the documentation as the product's own - and a
    # release only once Publish has published it, or by hand, from a dispatch on master that
    # names its tag (which the last clause lets through, as any dispatch on master). A run
    # Publish's completion started is given master as its ref, so the branch alone would let
    # every one of those through.
    if: >-
      (github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'release'
      && github.event.workflow_run.conclusion == 'success')
      || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write # the gh-pages branch, which is the site
    steps:
      # The deploy job builds nothing, so it needs none of the sources but the script that
      # writes the version index. Fetched into its own directory, and sparsely: the branch
      # that is the site is checked out below, into `site`, and a checkout of the repository
      # at the root of the workspace would clean the rest of it away. It is master's for a
      # release too, since a run Publish's completion started is given master's newest
      # commit: the index of every version is written by the newest rule.
      - name: Fetch the release machinery
        uses: actions/checkout@v7
        with:
          path: repository
          sparse-checkout: tools

      # A release is written under its own tag and frozen there; master is the moving one and
      # always lands in the same place. The tag is the `head_branch` of Publish's run, since
      # this run's own ref is master's, or the one a dispatch names.
      #
      # The tag has to start with `v`, because the version index below lists only the
      # directories that do. Publishing under any other name would succeed, and produce a
      # complete copy of the documentation at a url that nothing on the site links to and the
      # menu never offers - so this refuses instead, which is the failure that can be seen.
      # Publish refuses such a tag before it can succeed, and so does the build's check of a
      # named one; this goes on refusing it whatever they check.
      - name: Choose the directory this build is published under
        id: slot
        env:
          TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] || [ -n "$TAG" ]; then
            case "$TAG" in
              v[0-9]*) ;;
              *)
                echo "::error::release tag $TAG does not start with a v, so the"
                echo "::error::version menu would never list it. Re-create the release with a"
                echo "::error::tag of the form v<version>."
                exit 1
                ;;
            esac
            echo "name=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Look for the archive branch
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/gh-pages" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.archive.outputs.exists == 'true'
        with:
          ref: gh-pages
          path: site

      # The first deployment has no archive to restore, and the workflow starts one rather
      # than asking for a branch to be created by hand. The push below creates it on the
      # remote; the credentials actions/checkout would have left behind are set here instead.
      - name: Start the archive
        if: steps.archive.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          git -C site init --initial-branch gh-pages
          git -C site remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: html

      # This build replaces its directory rather than being copied over it: a page that no
      # longer exists in this build has no business surviving in the directory this build
      # owns.
      #
      # versions.json is what the menu on every page reads, including the pages of versions
      # published long before this one - which is why it is rewritten from what is on disk
      # rather than appended to. The root of the site redirects to the newest release: a
      # reader arriving without a version in the url wants the one they can install, not
      # master's account of features that are not released yet, and not a release candidate.
      #
      # The rule lives in the repository rather than in a heredoc here, so that the suite can
      # run it: as a heredoc nothing could, and it crowned the newest tag whatever it was -
      # publishing v0.10.0rc1 would have redirected the site at a release candidate and
      # labelled it "(stable)" in the menu of every page.
      #
      # Sphinx puts every asset it generates under a leading underscore - `_static`,
      # `_images`, `_sources`, `_modules`, `_plantuml` - and Jekyll, which GitHub runs over a
      # branch it serves, treats a leading underscore as private and publishes none of them.
      # The result is a site that answers 200 on every page and 404 on every stylesheet and
      # diagram, which reads as a styling glitch rather than as a build that dropped a third
      # of its output. Pages serves this branch, so the .nojekyll at its root is what keeps
      # Jekyll off every version the branch holds; the read-back below asks for a page and the
      # version index, and would not notice its loss.
      #
      # The commit says which commit of the repository it publishes: the one the build checked
      # out, which for a release is not the run's own sha - that is master's newest.
      #
      # A release's deploy and master's can push at once, each holding the branch as its
      # checkout found it, so the second to push is refused. A merge would not do: both
      # rewrote versions.json and the root redirect, and what those should hold is neither
      # side's but what site_versions.py writes over both directories. So a refused push takes
      # the branch as it now stands, puts this build's directory back on it, rewrites the index
      # from what is then on disk, and pushes again. A push refused for any other reason is
      # refused again each time, and the step fails after the fifth, saying so.
      - name: Publish this build on the site
        env:
          SLOT: ${{ steps.slot.outputs.name }}
          SOURCE: ${{ needs.build.outputs.commit }}
        run: |
          place() {
            rm -rf "site/${SLOT}"
            mkdir -p "site/${SLOT}"
            cp -a html/. "site/${SLOT}/"
            python3 repository/tools/site_versions.py site
            touch site/.nojekyll
          }
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          place
          for attempt in 1 2 3 4 5; do
            git -C site add --all
            if git -C site diff --cached --quiet; then
              echo "the site is already in this state, nothing to archive"
              exit 0
            fi
            git -C site commit --message "docs: publish ${SLOT} from ${SOURCE}"
            if git -C site push origin gh-pages; then
              exit 0
            fi
            echo "attempt ${attempt}: the push was refused; taking gh-pages as it now stands"
            git -C site fetch origin gh-pages
            git -C site reset --hard FETCH_HEAD
            place
          done
          echo "::error::gh-pages refused the push of ${SLOT} five times, each made over"
          echo "::error::the branch as it then stood: other deploys kept landing first, or the"
          echo "::error::push is refused whatever it holds - git's lines above say which."
          echo "::error::Nothing of ${SLOT} is published, and re-running this workflow starts"
          echo "::error::again from the branch as it is then."
          exit 1

      # The push above is the publish: Pages serves this branch directly. It used to be one of
      # two publishes - the branch, and an artifact handed to `actions/deploy-pages` - and
      # nothing made them agree. What finally parted them was not the split itself but how a
      # Pages deployment is addressed: `deploy-pages` keys one by commit sha, and a release tag
      # points at the commit master's own push has already deployed. The second deployment was
      # therefore a duplicate id, discarded, and the action reported success in five seconds
      # while the site went on serving the earlier build. It cost two releases - 0.6.0 and
      # 0.7.0 - and both times the archive branch was correct and the site was not.
      #
      # Serving the branch removes the sha from the question entirely. It also costs this job
      # two permissions and the deployment environment it needed to hold them.

      # Pages builds the branch on its own once the push lands, so the run has nothing left to
      # hand it - and the site's address comes from Pages rather than from a deployment step
      # that no longer exists. Asked for rather than assembled from the owner and the
      # repository name, so that a custom domain would not quietly send this check at a url
      # nobody reads.
      - name: Ask Pages where the site is
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      # Every step of a run can report success while the site serves something else: that is
      # how v0.6.0 and 0.7.0 both reached the archive branch, named in the version index beside
      # the versions before them, while the site went on serving a build assembled before the
      # release existed - documentation at a url that answered 404, offered by no menu, and
      # nothing red anywhere to say so.
      #
      # So the run ends by reading back what it published, which is the only statement about
      # the site made from outside the machinery that writes it. The query string defeats an
      # edge still answering for the previous build, and the budget covers a branch build that
      # queues behind another: it is deliberately longer than a build takes, because a check
      # that gives up early turns a slow publish into a failed one.
      - name: Read back what was published
        env:
          SLOT: ${{ steps.slot.outputs.name }}
          PAGE_URL: ${{ steps.site.outputs.url }}
        run: |
          site="${PAGE_URL%/}"
          for attempt in $(seq 1 20); do
            if [ "$attempt" -gt 1 ]; then sleep 15; fi
            bust="cb=${GITHUB_RUN_ID}-${attempt}"
            served=$(curl -sS -o /dev/null -w '%{http_code}' "${site}/${SLOT}/?${bust}" || echo none)
            index=$(curl -fsS "${site}/versions.json?${bust}" || true)
            if [ "$served" = 200 ] && printf '%s' "$index" | grep -q "\"${SLOT}\""; then
              echo "${site}/${SLOT}/ is served and the version index lists it"
              exit 0
            fi
            echo "attempt ${attempt}: ${SLOT} answered ${served}, index listed $(
              printf '%s' "$index" | tr -d ' \n' | tail -c 120
            )"
          done
          echo "::error::the push to gh-pages succeeded, but ${site}/${SLOT}/ is still not"
          echo "::error::served after five minutes. gh-pages is the site, so the branch now"
          echo "::error::carries what should be published: check whether Pages is still"
          echo "::error::configured to build from that branch, and look at the newest page"
          echo "::error::build for the error it reports. Re-running this workflow republishes"
          echo "::error::the branch as it now stands, which is what triggers a fresh build."
          exit 1
