[build-system]
# hatch-requirements-txt keeps the dependency lists in requirements files, which is where a
# container build, a pip-tools run and a vulnerability scanner all expect to find them.
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
# `ddd` is taken on PyPI. Only the distribution name differs: the import package, the CLI
# command and the `*.ddd.json` file convention all stay `ddd`.
name = "ddd-tool"
version = "0.5.0"
description = "Data Dictionary for global variables in component based embedded software projects"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Killian Daly" }]
keywords = ["embedded", "firmware", "a2l", "code-generation", "data-dictionary"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Embedded Systems",
]
# Both lists are read from the requirements files by the metadata hook configured below, so
# neither may also be stated here: declaring a field dynamic *and* statically is an error.
dynamic = ["dependencies", "optional-dependencies"]

[project.urls]
Homepage = "https://github.com/Sauci/ddd"
Documentation = "https://sauci.github.io/ddd/"
Specification = "https://github.com/Sauci/ddd/blob/master/SPEC.md"
Issues = "https://github.com/Sauci/ddd/issues"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
dev = ["requirements-dev.txt"]
docs = ["requirements-docs.txt"]

[project.scripts]
ddd = "ddd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ddd"]

# Shipped inside the package so that `ddd cmake-dir` finds it after a plain pip install,
# not only in a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"cmake/Ddd.cmake" = "ddd/cmake/Ddd.cmake"
# Example c templates for `ddd templates-dir`. A starting point to copy, never a fallback:
# a project that does not pass --template-dir generates nothing.
"examples/templates" = "ddd/templates"

[tool.hatch.build.targets.sdist]
# The file patterns are anchored with a leading slash: an unanchored "README.md" matches at
# any depth, the way a .gitignore line would, and pulled editors/vscode/README.md and
# assets/logo/README.md into the sdist.
include = [
    "/src/ddd",
    "/cmake",
    "/docker",
    "/docs",
    "/examples",
    "/schemas",
    "/tests",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/SPEC.md",
    "/requirements.txt",
    "/requirements-dev.txt",
    "/requirements-docs.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage runs with every test run, and a gap fails the run: a line nobody executes is a
# line nobody has ever seen behave. Use --no-cov for a quick partial run while developing.
addopts = "-q --cov --cov-report=term-missing --cov-fail-under=100"
pythonpath = ["src"]

[tool.coverage.run]
source = ["ddd"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = [
    # A Protocol body is a signature, not code.
    '^\s*\.\.\.$',
    'if TYPE_CHECKING:',
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH", "C4"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ddd"]
plugins = ["pydantic.mypy"]
