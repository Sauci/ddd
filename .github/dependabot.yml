version: 2

# What this is for is the day of a release rather than the day of an update. Every `uses:` in
# the three workflows is pinned by a major tag, the development requirements pin `ruff` and
# `mypy` to a minor, the documentation requirements pin `sphinx` exactly, the release's tools
# are each at one version, and the extension's and the browser interface's lock files pin
# their dependencies exactly - so nothing moves on its own, and without something proposing
# the moves nothing moves at all until a release is blocked by a tool nobody upgraded or an
# action whose major tag was retired.
#
# Weekly rather than daily: a pull request per dependency per day is noise on a repository
# with one maintainer, and none of these is a runtime dependency of what customers install.
updates:
  # The actions of ci.yml, docs.yml and publish.yml. Three of those jobs hold an OIDC token
  # that can publish to a package index, which is the reason to know when one moves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # requirements.txt, requirements-dev.txt and requirements-docs.txt, which the metadata hook
  # in pyproject.toml reads as the project's own dependency lists, and requirements-release.txt,
  # which publish.yml installs the release's build and twine from. Perhaps the backend that
  # pyproject.toml pins in [build-system] as well: Dependabot's documentation says nothing of
  # that table, so its first weekly run shows whether it proposes a move there. Not the vsce
  # the extension's scripts name: a version inside an npx command is no dependency.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  # The editor extension, whose package-lock.json is what `npm ci` installs from in the
  # extension job and in the job that packages the .vsix attached to a release.
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly

  # The browser interface, whose package-lock.json is what `npm ci` installs from in the gui job,
  # in the release build and the development build that compile the pages into a wheel, and in
  # the stage of the image that compiles them for it.
  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: weekly
