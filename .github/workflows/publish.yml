name: Publish

# Publishing is driven by GitHub Releases: create a release tagged `v<version>` and the
# workflow builds, verifies and uploads to PyPI. `workflow_dispatch` gives the same pipeline
# against TestPyPI for a dry run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build

      # The version lives in pyproject.toml, so a release tag can drift from what was built.
      # Catch that here rather than after an immutable upload.
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The VS Code extension goes to the marketplace, which is where somebody looking for it in
  # the Extensions view will find it, and where it updates itself afterwards. The same .vsix
  # is also attached to the release: that is a permanent url needing no account and no
  # network policy exception, which is how an air gapped site installs one. Built from the
  # tag, so the version inside the package is the version being released; a test asserts it
  # matches the python one.
  extension:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .vsix to the release being published
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # The extension's tests start the real language server, so the package it launches has
      # to be installed here as well as node being present.
      - run: pip install -e .
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
      - name: Attach the extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" editors/vscode/*.vsix --clobber

      # Published from the .vsix that was just built and attached rather than packaged a
      # second time, so the marketplace serves the same bytes the release does.
      #
      # Unlike the index upload below, this one cannot use a short lived OIDC token: the
      # marketplace has no equivalent of trusted publishing, so it needs a personal access
      # token from the Azure DevOps organisation owning the `sauci` publisher, stored as the
      # VSCE_PAT secret. Those tokens expire - a year at most - and the failure that produces
      # is this step, on a release, which is why it says so rather than only exiting.
      - name: Publish the extension to the marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not set. The marketplace needs a personal access token"
            echo "::error::with the Marketplace > Manage scope, from the Azure DevOps"
            echo "::error::organisation that owns the 'sauci' publisher. Add it as a repository"
            echo "::error::secret named VSCE_PAT and re-run this job; the release, the index"
            echo "::error::upload and the attached .vsix are unaffected."
            exit 1
          fi
          npx --yes @vscode/vsce publish --packagePath editors/vscode/ddd-"${GITHUB_REF_NAME#v}".vsix

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ddd-tool
    permissions:
      id-token: write # trusted publishing (OIDC), no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ddd-tool
    permissions:
      id-token: write # trusted publishing (OIDC), no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
