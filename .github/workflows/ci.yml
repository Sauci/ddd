name: CI

# Runs on every push to master and on every pull request. A branch with an open pull request
# is deliberately not built twice: the pull request build is the one that matters, and
# workflow_dispatch covers running any other branch on demand.
#
# The release pipeline in publish.yml runs the suite again before it builds. That is not
# redundant - a release can be cut from a commit, or with a version bump, that this workflow
# never saw, and an upload to an index cannot be taken back.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The package claims python 3.12, 3.13 and 3.14, and claims to be os independent. This is
    # what turns both into tested claims: a path handling bug that appeared only on linux has
    # already reached a user of this project once, having passed everything on windows.
    strategy:
      fail-fast: false # one cell failing must not hide whether the others do
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Installing the project rather than running it out of `src` is the point of this step:
      # it exercises the packaging metadata, which fails nothing locally - the tests import
      # from `src` - and so otherwise breaks first for whoever installs the distribution.
      - run: pip install -e ".[dev]"

      # The coverage gate lives in pyproject.toml, so it applies here without being restated.
      - run: pytest

  lint:
    # Style and types do not vary by platform or interpreter, so once is enough. mypy runs the
    # pydantic plugin and type checks against the real contracts, hence the same install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  container:
    # The image behind `docker compose` is the local equivalent of every job in this file, and
    # it was the one thing no job built: a `COPY` of a directory removed three releases earlier
    # failed `docker compose build` on its first line, and every service with it, while ci
    # stayed green - ci installs the package itself and never came near the image. Building it
    # here is what makes the local toolchain a tested claim rather than a documented one.
    #
    # The `generate` service runs after it, because a service's own command line is the other
    # half of what broke then: the image built and the service exited with a usage error from
    # an option set two releases old. It is the cheapest of the six that actually runs the
    # tool, and the bind mount means it runs the working tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build ddd
      # The pages of `ddd gui` come from a stage of the image's own, and an image that stopped
      # copying them would still build and run every service - a service runs the working tree,
      # PYTHONPATH first. -I leaves the working tree out, so what answers is the package
      # installed in the image. That stage exists so that node stays out of the image, which a
      # copy of the wrong directory from it would undo just as quietly, so both are asked.
      - name: Check the image carries the compiled pages and no node
        run: |
          docker compose run --rm ddd python -I -c '
          import shutil, sys
          from ddd.gui.server import static_directory
          if not (static_directory() / "index.html").is_file():
              sys.exit(f"the image has no {static_directory()}/index.html: ddd gui would have nothing to serve")
          node, npm = shutil.which("node"), shutil.which("npm")
          if not (node is None and npm is None):
              sys.exit(f"the image has node or npm on its path (node: {node}, npm: {npm}): only the pages were to reach it")
          '
      - run: docker compose run --rm generate

  extension:
    # The VS Code extension is a launcher for the language server, so what is worth testing is
    # that the command it builds really starts one - which needs both toolchains here, and is
    # why the tests install the package rather than only compiling typescript. Node 24 rather
    # than the distribution's, because the packaging step below needs a recent one; it was 20
    # until that line stopped taking security fixes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: pip install -e .
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      # Proves the artefact a customer would be handed can actually be produced. The
      # release workflow builds it again and attaches it to the release, which is where
      # anyone outside this repository should get it from: an artifact here expires and
      # needs a GitHub account to reach.
      - run: npm run package
        working-directory: editors/vscode
      - uses: actions/upload-artifact@v7
        with:
          name: ddd-vscode-extension
          path: editors/vscode/*.vsix
          overwrite: true # a name is unique within a run, and re-running the run uploads it again

  gui:
    # The browser interface: its types generated from the schemas, its lint and type check, its
    # logic under the coverage gate, its pages compiled, and those pages driven in a browser
    # against the real `ddd gui` - on both systems the package claims to run on. Node 24, as the
    # extension job has it; the python package is installed because the types and the server
    # both come from it.
    #
    # On ubuntu the pages it compiled then go into a wheel and an sdist, uploaded as
    # ddd-tool-<commit>: a branch installed from them needs no node, as a release needs none -
    # on a machine or in a container that only runs ddd, where node has no business. A release
    # is still what anyone outside this repository installs: an artifact expires, and needs a
    # GitHub account to reach.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: pip install -e ..
      - run: npm ci
      - run: npm run schemas
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Built at the root, where pyproject.toml is, once the pages have passed in the browser,
      # and checked the way the release checks its own. One system is enough: the wheel is pure
      # python, the same wherever it is built.
      - if: runner.os == 'Linux'
        working-directory: .
        run: |
          python -m pip install build
          python -m build --outdir dist
      - if: runner.os == 'Linux'
        name: Check the wheel carries the compiled pages
        working-directory: .
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          if "ddd/gui/static/index.html" not in names:
              sys.exit("the wheel has no ddd/gui/static/index.html: ddd gui would have nothing to serve")
          EOF
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: ddd-tool-${{ github.sha }}
          path: dist/
          overwrite: true # a name is unique within a run, and re-running the run uploads it again
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: gui/playwright-report
          overwrite: true # a name is unique within a run, and re-running the run uploads it again
