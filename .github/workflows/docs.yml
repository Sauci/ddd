name: Documentation

# The documentation is generated out of the sources - the command line reference from the
# argument parser, the file formats from the pydantic contracts - so it is built on every
# change and published from master. Warnings are errors, which is what makes that generation
# trustworthy: a reference that stops resolving fails the build instead of quietly
# disappearing from the page.
#
# The site keeps one directory per version. A push to master rewrites `latest`; publishing a
# release writes a directory named after its tag, and nothing writes to that directory again.
# Old documentation describes old code, so rebuilding it would only expose it to a toolchain
# that has moved on - a two year old tag that no longer builds under the sphinx of the day
# would take the deployment of the current one down with it.
#
# A build produces one version, and the site is all of them, so the versions that are not
# being built have to come from somewhere: the `gh-pages` branch holds them. That branch is
# the site rather than an archive of it - Pages is configured to build from it, so the push
# below is the publish and there is no second copy to disagree with.
#
# The two diagram programs come from apt rather than from a prepared image, so that this needs
# nothing but a stock runner to reproduce. Only html is built: a pdf would want a LaTeX
# distribution, roughly a gigabyte of packages, and nothing asks for one.
on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# The published site and the branch it is archived on are both single shared resources, so
# every run that deploys queues behind the last one rather than racing it, whichever event
# started it. Superseding a pull request build is free, and those deploy nothing.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          # What `.[docs]` resolves to: the metadata hook reads both files.
          cache-dependency-path: requirements*.txt

      # graphviz draws the entity relationship figures erdantic emits, and plantuml draws the
      # `.. uml::` diagrams, bringing the headless jre it runs on with it. docs/conf.py uses
      # the `plantuml` launcher on the PATH when no jar is pointed at, which is the one here.
      - name: Install the diagram tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz plantuml

      - run: pip install -e ".[docs]"
      - run: sphinx-build -b html docs build/docs/html -W --keep-going

      # A plain artifact rather than a Pages one: this is a single version, and what gets
      # published is this version merged into every other one the deploy job restores.
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: build/docs/html

  # Publishing needs Pages set to serve the gh-pages branch once, in the repository settings:
  # the push below lands whether or not anything serves the branch, and the read-back at the
  # end of the job is what notices when nothing does.
  deploy:
    needs: build
    # Never from a feature branch, and never from a pull request, which on a fork would mean
    # publishing somebody else's revision of the documentation as the product's own.
    if: github.event_name == 'release' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the gh-pages branch, which is the site
    steps:
      # A release is written under its own tag and frozen there; master is the moving one and
      # always lands in the same place.
      #
      # The tag has to start with `v`, because the version index below lists only the
      # directories that do. Publishing under any other name would succeed, and produce a
      # complete copy of the documentation at a url that nothing on the site links to and the
      # menu never offers - so this refuses instead, which is the failure that can be seen.
      - name: Choose the directory this build is published under
        id: slot
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            case "$GITHUB_REF_NAME" in
              v[0-9]*) ;;
              *)
                echo "::error::release tag $GITHUB_REF_NAME does not start with a v, so the"
                echo "::error::version menu would never list it. Re-create the release with a"
                echo "::error::tag of the form v<version>."
                exit 1
                ;;
            esac
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Look for the archive branch
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/gh-pages" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.archive.outputs.exists == 'true'
        with:
          ref: gh-pages
          path: site

      # The first deployment has no archive to restore, and the workflow starts one rather
      # than asking for a branch to be created by hand. The push below creates it on the
      # remote; the credentials actions/checkout would have left behind are set here instead.
      - name: Start the archive
        if: steps.archive.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          git -C site init --initial-branch gh-pages
          git -C site remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: html

      # Removed rather than copied over: a page that no longer exists in this build has no
      # business surviving in the directory this build owns.
      - name: Put this build in its directory
        env:
          SLOT: ${{ steps.slot.outputs.name }}
        run: |
          rm -rf "site/${SLOT}"
          mkdir -p "site/${SLOT}"
          cp -a html/. "site/${SLOT}/"

      # versions.json is what the menu on every page reads, including the pages of versions
      # published long before this one - which is why it is rewritten from what is on disk
      # rather than appended to. The root of the site redirects to the newest release: a
      # reader arriving without a version in the url wants the one they can install, not
      # master's account of features that are not released yet.
      - name: Write the version index
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          site = pathlib.Path("site")

          def order(name):
              """Newest first, with a prerelease behind the release it leads to."""
              match = re.fullmatch(r"v(\d+(?:\.\d+)*)(.*)", name)
              if not match:
                  return ((), False, name)
              numbers = tuple(int(part) for part in match.group(1).split("."))
              return (numbers, match.group(2) == "", match.group(2))

          tags = sorted(
              (d.name for d in site.iterdir() if d.is_dir() and d.name.startswith("v")),
              key=order,
              reverse=True,
          )
          versions = (["latest"] if (site / "latest").is_dir() else []) + tags
          # Before the first release there is nothing else to land on.
          stable = tags[0] if tags else "latest"

          (site / "versions.json").write_text(
              json.dumps({"stable": stable, "versions": versions}, indent=2) + "\n"
          )
          (site / "index.html").write_text(
              "<!DOCTYPE html>\n"
              '<html lang="en">\n'
              "  <head>\n"
              '    <meta charset="utf-8">\n'
              f'    <meta http-equiv="refresh" content="0; url=./{stable}/">\n'
              f'    <link rel="canonical" href="./{stable}/">\n'
              "    <title>DDD documentation</title>\n"
              "  </head>\n"
              "  <body>\n"
              f'    <p>Redirecting to <a href="./{stable}/">the {stable} documentation</a>.</p>\n'
              "  </body>\n"
              "</html>\n"
          )
          print(f"stable is {stable}, versions are {', '.join(versions)}")
          PY

      # Sphinx puts every asset it generates under a leading underscore - `_static`,
      # `_images`, `_sources`, `_modules`, `_plantuml` - and Jekyll, which GitHub runs over a
      # branch it serves, treats a leading underscore as private and publishes none of them.
      # The result is a site that answers 200 on every page and 404 on every stylesheet and
      # diagram, which reads as a styling glitch rather than as a build that dropped a third
      # of its output. The artifact this workflow currently uploads is served without Jekyll
      # and does not need the file; it is written anyway so that the archive branch is
      # servable on its own, which is what lets the Pages source move to it.
      - name: Keep Jekyll from eating the underscored directories
        run: touch site/.nojekyll

      - name: Commit the new state of the site
        env:
          SLOT: ${{ steps.slot.outputs.name }}
        run: |
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site add --all
          if git -C site diff --cached --quiet; then
            echo "the site is already in this state, nothing to archive"
          else
            git -C site commit --message "docs: publish ${SLOT} from ${GITHUB_SHA}"
            git -C site push origin gh-pages
          fi

      # The push above is the publish: Pages serves this branch directly. It used to be one of
      # two publishes - the branch, and an artifact handed to `actions/deploy-pages` - and
      # nothing made them agree. What finally parted them was not the split itself but how a
      # Pages deployment is addressed: `deploy-pages` keys one by commit sha, and a release tag
      # points at the commit master's own push has already deployed. The second deployment was
      # therefore a duplicate id, discarded, and the action reported success in five seconds
      # while the site went on serving the earlier build. It cost two releases - 0.6.0 and
      # 0.7.0 - and both times the archive branch was correct and the site was not.
      #
      # Serving the branch removes the sha from the question entirely. It also costs this job
      # two permissions and the deployment environment it needed to hold them.

      # Pages builds the branch on its own once the push lands, so the run has nothing left to
      # hand it - and the site's address comes from Pages rather than from a deployment step
      # that no longer exists. Asked for rather than assembled from the owner and the
      # repository name, so that a custom domain would not quietly send this check at a url
      # nobody reads.
      - name: Ask Pages where the site is
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      # Every step of a run can report success while the site serves something else: that is
      # how v0.6.0 and 0.7.0 both reached the archive branch, named in the version index beside
      # the versions before them, while the site went on serving a build assembled before the
      # release existed - documentation at a url that answered 404, offered by no menu, and
      # nothing red anywhere to say so.
      #
      # So the run ends by reading back what it published, which is the only statement about
      # the site made from outside the machinery that writes it. The query string defeats an
      # edge still answering for the previous build, and the budget covers a branch build that
      # queues behind another: it is deliberately longer than a build takes, because a check
      # that gives up early turns a slow publish into a failed one.
      - name: Read back what was published
        env:
          SLOT: ${{ steps.slot.outputs.name }}
          PAGE_URL: ${{ steps.site.outputs.url }}
        run: |
          site="${PAGE_URL%/}"
          for attempt in $(seq 1 20); do
            if [ "$attempt" -gt 1 ]; then sleep 15; fi
            bust="cb=${GITHUB_RUN_ID}-${attempt}"
            served=$(curl -sS -o /dev/null -w '%{http_code}' "${site}/${SLOT}/?${bust}" || echo none)
            index=$(curl -fsS "${site}/versions.json?${bust}" || true)
            if [ "$served" = 200 ] && printf '%s' "$index" | grep -q "\"${SLOT}\""; then
              echo "${site}/${SLOT}/ is served and the version index lists it"
              exit 0
            fi
            echo "attempt ${attempt}: ${SLOT} answered ${served}, index listed $(
              printf '%s' "$index" | tr -d ' \n' | tail -c 120
            )"
          done
          echo "::error::the push to gh-pages succeeded, but ${site}/${SLOT}/ is still not"
          echo "::error::served after five minutes. gh-pages is the site, so the branch now"
          echo "::error::carries what should be published: check whether Pages is still"
          echo "::error::configured to build from that branch, and look at the newest page"
          echo "::error::build for the error it reports. Re-running this workflow republishes"
          echo "::error::the branch as it now stands, which is what triggers a fresh build."
          exit 1
