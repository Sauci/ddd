name: Publish

# Publishing is driven by GitHub Releases: create a release tagged `v<version>` and the
# workflow builds, verifies and uploads to PyPI. `workflow_dispatch` gives the same pipeline
# against TestPyPI for a dry run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build

      # The version lives in pyproject.toml, so a release tag can drift from what was built.
      # Catch that here rather than after an immutable upload.
      #
      # The whole tag has to match, `v` included, rather than the version it carries. The
      # prefix is not decoration: docs.yml names the directory it publishes a release under
      # after the tag, and lists only the directories starting with `v` in the version menu.
      # A tag of `0.5.0` therefore passed a check that stripped an optional `v`, and then
      # published documentation into a directory nothing linked to.
      - name: Check tag matches package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME is not v$version, the version in"
            echo "::error::pyproject.toml. Delete the release and its tag, then re-create it"
            echo "::error::as v$version; nothing has been uploaded yet."
            exit 1
          fi

      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The VS Code extension is delivered as the .vsix attached to the release: a permanent url
  # needing no account and no network policy exception, which is how an air gapped site
  # installs one. Built from the tag, so the version inside the package is the version being
  # released; a test asserts it matches the python one.
  #
  # It is deliberately not published to the Visual Studio Marketplace. That step existed,
  # needed a personal access token from an Azure DevOps organisation owning a `sauci`
  # publisher, and failed on every release it ran on because neither was ever created - while
  # the rest of the pipeline reported success around it. Four pages told a customer to search
  # the Extensions view for an item that answers 404. Publishing there again means creating
  # the publisher first, and putting those pages back with it.
  extension:
    # `build` rather than `test`, for the tag check it carries: this job names the .vsix it
    # publishes after the tag, so nothing here may run under a tag that check would reject.
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .vsix to the release being published
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # The extension's tests start the real language server, so the package it launches has
      # to be installed here as well as node being present.
      - run: pip install -e .
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
      - name: Attach the extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" editors/vscode/*.vsix --clobber

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ddd-tool
    permissions:
      id-token: write # trusted publishing (OIDC), no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ddd-tool
    permissions:
      id-token: write # trusted publishing (OIDC), no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
