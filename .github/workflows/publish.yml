name: Publish

# Publishing is driven by GitHub Releases: create a release tagged `v<version>` and the
# workflow runs every job of ci.yml on it, builds it, installs what it built and checks it,
# and uploads it to PyPI. `workflow_dispatch` gives the same pipeline against TestPyPI for a
# dry run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  # Every job of ci.yml, run again on the release's own commit before anything is built for
  # upload: a release can be cut from a commit, or with a version bump, that ci never saw, and
  # an upload to an index cannot be taken back. This used to be a job of its own that ran the
  # python suite on one of ci's six cells, and none of the page's own gates - Biome, Vitest, the
  # journeys - nor anything on windows. Called rather than copied, the two cannot drift: GitHub
  # runs ci.yml from this very commit, as part of this run, so a job of it failing fails the
  # run, and the documentation, which waits on this run's conclusion, waits on every one of them.
  #
  # Called so, ci.yml is given this run's github context - the release event, its tag and its
  # commit, the name Publish in github.workflow and this run's id - and as inputs only those
  # this job passes, which are none: its journeys run once each, and nothing is skipped as in a
  # hunt. Its header says what it then does differently: a concurrency group of this run's own,
  # no wheel from its gui job, and none of its development builds, which run on a push or a
  # pull request alone.
  #
  # A called workflow's jobs keep no permission its caller withholds - GitHub documents that a
  # called workflow can only lower them - and ci.yml's dev-publish asks for id-token: write, so
  # the call allows it rather than leave GitHub to reject ci.yml for asking. ci.yml's own
  # `permissions: contents: read` holds every other job of it to reading, and dev-publish never
  # runs here.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Each tool at one version, as everything a release is built with is: build and twine
      # were whatever was newest that morning. requirements-release.txt says why, and
      # dependabot moves it. The runner's own pip installs them, as ci's builds have it.
      - run: python -m pip install -r requirements-release.txt
      # The wheel carries the compiled pages of `ddd gui`, which git does not track: they are
      # compiled here, against types generated by the package itself, hence its install first.
      # `npm run build` does not check the types, so they are checked here before the pages
      # that ship are compiled, as ci's gui job checked them for this commit above.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: pip install -e .
      - run: npm ci && npm run schemas && npm run typecheck && npm run build
        working-directory: gui
      - run: python -m build
      - name: Check the wheel carries the compiled pages
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          if "ddd/gui/static/index.html" not in names:
              sys.exit("the wheel has no ddd/gui/static/index.html: ddd gui would have nothing to serve")
          EOF

      # The version lives in pyproject.toml, so a release tag can drift from what was built.
      # Catch that here rather than after an immutable upload.
      #
      # The whole tag has to match, `v` included, rather than the version it carries. The
      # prefix is not decoration: docs.yml names the directory it publishes a release under
      # after the tag, and lists only the directories starting with `v` in the version menu.
      # A tag of `0.5.0` therefore passed a check that stripped an optional `v`, and then
      # published documentation into a directory nothing linked to.
      - name: Check tag matches package version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME is not v$version, the version in"
            echo "::error::pyproject.toml. Delete the release and its tag, then re-create it"
            echo "::error::as v$version; nothing has been uploaded yet."
            exit 1
          fi

      - run: twine check --strict dist/*

      # The wheel as whoever installs it meets it, before it is handed to the jobs that upload
      # it: installed into a fresh environment rather than the one it was built in, with its
      # dependencies from the index, and run from an empty directory. The one look the release
      # took at its artefact used to be the listing above, and it was never installed.
      # tools/installed_wheel.py holds what the installation answers to the wheel itself - its
      # version, its templates, its cmake module and the page ddd gui serves - and says why
      # each is asked.
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install dist/*.whl
      # The version the run publishes: on a release, or a dispatch from a `v` tag, the tag's,
      # which the check above has held pyproject.toml to; on a dry run from a branch, the
      # version pyproject.toml states.
      - name: Check the installed wheel answers as the release
        run: |
          version=$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "$GITHUB_EVENT_NAME" = release ] || [[ $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
          fi
          python -I tools/installed_wheel.py dist/*.whl "$version" "$RUNNER_TEMP/installed/bin/ddd"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The VS Code extension is delivered as the .vsix attached to the release: a permanent url
  # needing no account and no network policy exception, which is how an air gapped site
  # installs one. Built from the tag, so the version inside the package is the version being
  # released; a test asserts it matches the python one.
  #
  # It is deliberately not published to the Visual Studio Marketplace. That step existed,
  # needed a personal access token from an Azure DevOps organisation owning a `sauci`
  # publisher, and failed on every release it ran on because neither was ever created - while
  # the rest of the pipeline reported success around it. Four pages told a customer to search
  # the Extensions view for an item that answers 404. Publishing there again means creating
  # the publisher first, and putting those pages back with it.
  extension:
    # `build` rather than `ci`, for the tag check it carries: this job names the .vsix it
    # publishes after the tag, so nothing here may run under a tag that check would reject.
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .vsix to the release being published
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # The extension's tests start the real language server, so the package it launches has
      # to be installed here as well as node being present.
      - run: pip install -e .
      - run: npm ci
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
      - name: Attach the extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" editors/vscode/*.vsix --clobber

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ddd-tool
    permissions:
      id-token: write # trusted publishing (OIDC), no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # The dispatch is the dry run, and the dry run may not reach pypi.org from wherever it was
  # started. Gated on the input alone, running Publish with `target: pypi` on a feature branch
  # built whatever `pyproject.toml` said there and uploaded it: the tag check above did not
  # run (it was a release only step), the .vsix and the documentation directory did not
  # either, and nothing outside this file objected - the `pypi` environment carries no branch
  # policy. An index accepts a file name once and for ever, so the only way back from such an
  # upload is the next version number.
  #
  # A dispatch from a `v*` tag stays open on purpose: it is the same input the release event
  # arrives with, and it now passes through the same tag check.
  publish-pypi:
    needs: build
    if: github.event_name == 'release' || (inputs.target == 'pypi' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ddd-tool
    permissions:
      id-token: write # trusted publishing (OIDC), no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
