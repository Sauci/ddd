version: 2

# What this is for is the day of a release rather than the day of an update. Every `uses:` in
# the three workflows is pinned by a major tag, the development requirements pin `ruff` and
# `mypy` to a minor, and the extension's and the browser interface's lock files pin their
# dependencies exactly - so nothing moves on its own, and without something proposing the
# moves nothing moves at all until a release is blocked by a tool nobody upgraded or an
# action whose major tag was retired.
#
# Weekly rather than daily: a pull request per dependency per day is noise on a repository
# with one maintainer, and none of these is a runtime dependency of what customers install.
updates:
  # The actions of ci.yml, docs.yml and publish.yml. Two of those jobs hold an OIDC token
  # that can publish to the package index, which is the reason to know when one moves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # requirements.txt, requirements-dev.txt and requirements-docs.txt, which the metadata hook
  # in pyproject.toml reads as the project's own dependency lists.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  # The editor extension, whose package-lock.json is what `npm ci` installs from in the
  # extension job and in the job that packages the .vsix attached to a release.
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly

  # The browser interface, whose package-lock.json is what `npm ci` installs from in the gui job,
  # in the release build that compiles the pages into the wheel, and in the stage of the image
  # that compiles them for it.
  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: weekly
